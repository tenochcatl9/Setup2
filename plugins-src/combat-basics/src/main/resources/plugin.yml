name: CombatBasics
version: 1.1.0
main: dev.tenohost.combatbasics.CombatBasicsPlugin
api-version: '26.3'
description: Desarma escudos bloqueados con ataques de azada y los expulsa con física.
commands:
  combatbasics:
    description: Entrega la espada con la habilidad Dash.
    aliases: [combat]
    usage: /combat give <jugador> [dash]
    permission: combatbasics.give
permissions:
  combatbasics.give:
    description: Permite entregar la espada Dash.
    default: op
